<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Neo-Test editor and coverage details view</title>
  <desc id="desc">A conceptual Visual Studio editor with covered, uncovered, and failed-test markers, plus a coverage details panel.</desc>
  <defs><linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1f2937"/></linearGradient><style>text{font-family:Segoe UI,Arial,sans-serif}.muted{fill:#94a3b8}.code{font-family:Consolas,monospace;fill:#d1d5db;font-size:17px}.label{fill:#e5e7eb;font-size:18px;font-weight:600}.small{fill:#cbd5e1;font-size:15px}</style></defs>
  <rect width="1200" height="675" fill="url(#background)"/><text x="48" y="58" fill="#f8fafc" font-size="30" font-weight="700">Neo-Test at a glance</text><text x="48" y="86" class="muted" font-size="17">Illustrative feature map — not a live Visual Studio screenshot</text>
  <rect x="48" y="120" width="690" height="505" rx="10" fill="#0b1220" stroke="#475569"/><rect x="48" y="120" width="690" height="42" rx="10" fill="#182235"/><circle cx="77" cy="141" r="6" fill="#f87171"/><circle cx="99" cy="141" r="6" fill="#fbbf24"/><circle cx="121" cy="141" r="6" fill="#34d399"/><text x="150" y="147" class="small">OrderService.cs</text>
  <rect x="67" y="180" width="5" height="24" rx="2" fill="#2ea043"/><rect x="67" y="207" width="5" height="24" rx="2" fill="#2ea043"/><rect x="67" y="234" width="5" height="24" rx="2" fill="#808080"/><rect x="67" y="261" width="5" height="24" rx="2" fill="#dc3545"/><rect x="67" y="288" width="5" height="24" rx="2" fill="#808080"/>
  <text x="92" y="199" class="muted" font-size="16">18</text><text x="92" y="226" class="muted" font-size="16">19</text><text x="92" y="253" class="muted" font-size="16">20</text><text x="92" y="280" class="muted" font-size="16">21</text><text x="92" y="307" class="muted" font-size="16">22</text><text x="130" y="199" class="code">if (order.IsCancelled)</text><text x="150" y="226" class="code">return Result.Cancelled;</text><text x="130" y="253" class="code">if (order.IsPriority)</text><text x="150" y="280" class="code">return SendPriority(order);</text><text x="130" y="307" class="code">return SendStandard(order);</text>
  <rect x="99" y="345" width="465" height="86" rx="7" fill="#1e293b" stroke="#475569"/><text x="119" y="375" class="label">Line 21 · A related test failed</text><text x="119" y="405" class="small">Click the red marker to open the failing test.</text><rect x="668" y="177" width="43" height="43" rx="22" fill="#e09d00"/><text x="680" y="207" fill="#fff" font-size="25" font-weight="700">!</text><text x="585" y="246" class="small">72.4% line coverage</text>
  <rect x="775" y="120" width="377" height="505" rx="10" fill="#0b1220" stroke="#475569"/><text x="803" y="161" fill="#f8fafc" font-size="22" font-weight="700">Coverage Details</text><text x="803" y="195" class="muted" font-size="15">Project / file</text><text x="1050" y="195" class="muted" font-size="15">Line</text><line x1="803" x2="1125" y1="210" y2="210" stroke="#334155"/><text x="803" y="247" class="label">Solution</text><text x="1050" y="247" fill="#34d399" font-size="17">83.7%</text><text x="823" y="285" class="small">▾ Core</text><text x="1050" y="285" fill="#34d399" font-size="17">88.1%</text><text x="843" y="323" class="small">OrderService.cs</text><text x="1050" y="323" fill="#fbbf24" font-size="17">72.4%</text><text x="843" y="361" class="small">Pricing.cs</text><text x="1050" y="361" fill="#34d399" font-size="17">94.0%</text><text x="823" y="399" class="small">▸ Web</text><text x="1050" y="399" fill="#f87171" font-size="17">43.2%</text>
  <rect x="803" y="456" width="95" height="32" rx="5" fill="#334155"/><text x="817" y="477" class="small">Failed</text><rect x="908" y="456" width="104" height="32" rx="5" fill="#334155"/><text x="922" y="477" class="small">Changed</text><rect x="1022" y="456" width="92" height="32" rx="5" fill="#334155"/><text x="1038" y="477" class="small">Stale</text><text x="803" y="558" class="muted" font-size="14">Search, sort, filter, pin, refresh, copy, export</text>
</svg>
